# Configuración de la ejecución final · Aurum Market
#
# Este fichero es un artefacto de entrega (RF-25): declara exactamente con qué
# parámetros se produjeron los resultados. Cambiar un valor de aquí invalida los
# artefactos y obliga a regenerarlos con `aurum deliver`.

schema_version: "1.0"

# --- Representación -----------------------------------------------------------
# Elegido en ADR-005 tras comparar cuatro configuraciones sobre desarrollo.
representation:
  embedding_model: intfloat/multilingual-e5-base
  dimension: 768
  text_strategy: title_brand_color
  normalized: true
  query_prefix: "query: "
  document_prefix: "passage: "
  # Evidencia que sostiene la elección (perfil sample, oráculo exacto):
  #   E0 tfidf    raw_text           nDCG 0.6198  Recall 0.3031  MRR 0.9167
  #   E1 e5-small raw_text           nDCG 0.6427  Recall 0.2830  MRR 0.8125
  #   E2 e5-small title_brand_color  nDCG 0.6881  Recall 0.3277  MRR 0.8542
  #   E3 e5-base  title_brand_color  nDCG 0.7072  Recall 0.3648  MRR 0.9375

# --- Índice y base de datos ---------------------------------------------------
# Los parámetros HNSW se justifican y se barren en la Fase 5 (RF-08, RF-20).
index:
  engine: qdrant
  collection: aurum-market-catalogo
  distance: cosine
  hnsw:
    m: 24
    ef_construct: 120
    # 256, no el 128 heredado de la sesión 03. El barrido midió fidelidad 1,0
    # frente a 0,9875, y las latencias (47,16 ms vs 44,00 ms) están dentro del
    # ruido del transporte. Ver ADR-007.
    ef_search: 256
  # En KILOBYTES y por segmento, no por colección. Con los valores por defecto
  # (20.000) la muestra nunca construiría el grafo y Qdrant respondería por
  # fuerza bruta, dejando m y ef_construct sin efecto observable. Ver ADR-006.
  indexing_threshold_kb: 1000
  full_scan_threshold_kb: 1000

# --- Evaluación ---------------------------------------------------------------
evaluation:
  top_k: 10
  # Exact y Substitute cuentan como relevantes; Complement no. Ver ADR-004.
  relevance_threshold: 2.0
  relevance_mapping: { E: 3, S: 2, C: 1, I: 0 }
  # Recall@10 no puede superar este valor con estos juicios: 198 relevantes
  # repartidos en 8 consultas y solo diez posiciones.
  recall_ceiling: 0.5188

# --- Ingesta ------------------------------------------------------------------
ingestion:
  profile: full
  batch_size: 256

# --- Duplicados ---------------------------------------------------------------
# CONGELADO. Calibrado con altas_desarrollo.csv y fijado ANTES de ejecutar una
# sola predicción sobre altas_evaluacion.csv (P-04). Reajustarlo después de ver
# el conjunto ciego invalidaría la evaluación.
duplicates:
  threshold: 0.9191
  calibrated_on: altas_desarrollo.csv
  calibrated_at: "2026-08-02"
  # La ficha entrante se compone igual que el catálogo: comparar su `text` en
  # bruto contra un catálogo indexado como title+brand+color compara cosas
  # distintas. Alinear ambos lados multiplica por 18 la separación.
  query_text_strategy: title_brand_color
  candidates_per_listing: 2
  # Resultado sobre desarrollo con este umbral:
  #   precision 1.0 · recall 1.0 · F1 1.0 · TP=7 FP=0 TN=7 FN=0
  #   duplicados [0.9484, 0.9662] · nuevos [0.8521, 0.8898] · hueco 0.0586
  # Las clases no se solapan, así que cualquier umbral dentro del hueco acierta
  # en desarrollo: se toma el punto medio por dejar el margen más ancho a ambos
  # lados para casos no vistos. Ver ADR-008.
  margin_used_in_rule: false
